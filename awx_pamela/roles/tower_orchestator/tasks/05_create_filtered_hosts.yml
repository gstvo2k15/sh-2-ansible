---
- name: Read selected product INI from project checkout
  set_fact:
    inventory_ini_content: "{{ lookup('file', playbook_dir ~ '/' ~ ini_source_path) }}"

- name: Extract calculated group block from INI
  set_fact:
    filtered_group_match: "{{ inventory_ini_content | regex_search('(?ms)^\\[' ~ (launch_limit | regex_escape) ~ '\\]\\s*\\n.*?(?=^\\[|\\Z)') }}"

- name: Remove group header from matched block
  set_fact:
    filtered_group_body: "{{ filtered_group_match | regex_replace('(?ms)^\\[' ~ (launch_limit | regex_escape) ~ '\\]\\s*\\n', '') }}"

- name: Build filtered host lines
  set_fact:
    filtered_host_lines: >-
      {{
        filtered_group_body.splitlines()
        | map('trim')
        | reject('equalto', '')
        | reject('match', '^#')
        | list
      }}


- name: Detect Windows hosts in filtered inventory
  set_fact:
    inventory_has_windows: >-
      {{
        (
          filtered_host_lines
          | select('match', '^[a-z]+v0ii')
          | list
          | length
        )
      }}

- name: Override credential for weblogic_windows
  set_fact:
    cred_id: 27
  when:
    - inventory_has_windows | int > 0
    - product_family in ['weblogic','iis']


- name: Debug of filtered hosts
  debug:
    msg: "{{ filtered_host_lines | length }}"

- name: Create group matching calculated limit
  uri:
    url: "{{ ansible_url }}/inventories/{{ inventory_id }}/groups/"
    method: POST
    status_code: [200, 201]
    headers:
      Accept: application/json
      Authorization: "Bearer {{ svc_token }}"
    validate_certs: false
    body_format: json
    body:
      name: "{{ launch_limit }}"
      inventory: "{{ inventory_id | int }}"
  register: filtered_group

- name: Create filtered hosts in temporary inventory
  uri:
    url: "{{ ansible_url }}/inventories/{{ inventory_id }}/hosts/"
    method: POST
    status_code: [200, 201,400]
    headers:
      Accept: application/json
      Authorization: "Bearer {{ svc_token }}"
    validate_certs: false
    body_format: json
    body:
      name: "{{ item.split()[0] }}"
      inventory: "{{ inventory_id | int }}"
      variables: "{{ filtered_host_vars | to_nice_yaml }}"
  vars:
    filtered_host_vars: >-
      {{
        dict(
          item.split()[1:]
          | select('search', '=')
          | map('split', '=', 1)
        )
      }}
  loop: "{{ filtered_host_lines }}"
  register: filtered_hosts_created
  failed_when: false

- name: Show filtered inventory summary
  debug:
    msg:
      inventory_id: "{{ inventory_id }}"
      ini_source_path: "{{ ini_source_path }}"
      launch_limit: "{{ launch_limit }}"
      hosts_created: "{{ filtered_host_lines | length }}"