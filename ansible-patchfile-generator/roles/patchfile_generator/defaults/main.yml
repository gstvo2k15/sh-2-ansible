---
patch_valid_products:
  - java
  - apache
  - apache_sso
  - tomcat
  - jbossews
  - jbosseap
  - weblogic

patch_java_inventory_files:
  - apache.ini
  - apache_sso.ini
  - tomcat.ini
  - jbossews.ini
  - jbosseap.ini
  - weblogic.ini


# Temp workdir for cloned repos
patch_work_root: "/tmp"


# Repositories. Override these from Tower/AAP variables.
patch_inventory_repo_url: "https://github.com/scm/middleware/elastic_inventory.git"
patch_inventory_repo_version: develop
patch_inventory_checkout: "{{ patch_work_root }}/inventories"

patch_repository_url: "https://github.com/scm/middleware/ansible-patchfile-generator.git"
patch_repository_version: develop
patch_repository_checkout: "{{ patch_work_root }}/patchfiles"

# Path inside the inventory repository containing *.ini files.
patch_inventory_subdir: inventories

# Paths inside the output repository.
patch_hostfiles_subdir: generated/patching
patch_varfiles_subdir: generated/vars

# Commit identity used by the Tower/AAP job.
patch_git_user_name: "AAP Patchfile Generator"
patch_git_user_email: "aap-patchfiles@localhost"

# Push changes at the end of the job.
patch_git_push: true